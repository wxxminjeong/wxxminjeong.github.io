<!DOCTYPE html>
<html lang="ko">
<head>
  {% include head.html %}
</head>
<body{% if site.sparkles %} data-sparkles{% endif %}>
  <a class="skip" href="#content">본문 바로가기</a>
  <div class="page">
    <header class="masthead">
      <a class="wordart" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p class="tagline">{{ site.subtitle }}</p>
    </header>

    <div class="marquee" aria-hidden="true">
      <marquee scrollamount="4">{{ site.marquee }}</marquee>
    </div>

    <div class="layout">
      <aside class="sidebar">
        {% include sidebar.html %}
      </aside>
      <main id="content" class="main">
        {{ content }}
      </main>
    </div>

    {% include footer.html %}
  </div>
  <script src="{{ '/assets/js/retro.js' | relative_url }}" defer></script>
</body>
</html>
