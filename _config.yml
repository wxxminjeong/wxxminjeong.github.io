# ==========================================================
#  사이트 설정
#  고친 뒤에는 로컬 서버(jekyll serve)를 다시 켜야 반영됩니다.
# ==========================================================

title: wxxminjeong github io
description: Notes on things I learn and build.
author: wxxminjeong
github_username: wxxminjeong
url: https://wxxminjeong.github.io
baseurl: ""
lang: en_US
timezone: Asia/Seoul

# 왼쪽 위 로고 글씨 (두 줄)
brand:
  line1: wxxminjeong
  line2: github io

# 첫 화면에 보일 글 개수
front_page_posts: 10

# 댓글: giscus (이 저장소의 GitHub Discussions에 저장됩니다)
# 값은 https://giscus.app 에서 저장소를 입력하면 나오는 것과 같습니다
giscus:
  repo: wxxminjeong/wxxminjeong.github.io
  repo_id: R_kgDOVcfJ8A
  category: Announcements
  category_id: DIC_kwDOVcfJ8M4DJ937

# ----------------------------------------------------------
#  빌드 설정 (보통은 건드리지 않아도 됩니다)
# ----------------------------------------------------------
theme: null   # GitHub Pages 기본 테마(primer)를 끄고 직접 만든 레이아웃만 사용
permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true   # 코드는 색 없이 <pre>로

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
