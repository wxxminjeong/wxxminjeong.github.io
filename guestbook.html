{%- assign repo = site.guestbook.repo -%}
<h1>방명록</h1>

<p>다녀가신 김에 한 마디 남겨주세요!</p>
<p><font size="-1">※ 방명록은 GitHub 이슈로 올라갑니다. <b>보내기</b>를 누르면 GitHub 글쓰기 화면이 열리고,
거기서 한 번 더 <b>Submit new issue</b>를 눌러야 등록됩니다. (GitHub 로그인 필요)</font></p>

<form action="https://github.com/{{ repo }}/issues/new" method="get" target="_blank">
<input type="hidden" name="title" value="{{ site.guestbook.title_prefix | escape }}">
<table border="0" cellpadding="2">
<tr>
<td valign="top">남기실 말씀:</td>
<td><textarea name="body" rows="6" cols="50"></textarea></td>
</tr>
<tr>
<td></td>
<td><input type="submit" value="보내기"> <input type="reset" value="다시 쓰기"></td>
</tr>
</table>
</form>

<hr>
<h2>남겨주신 글</h2>
<div id="guestbook" data-repo="{{ repo }}" data-prefix="{{ site.guestbook.title_prefix | escape }}">
<p>불러오는 중...</p>
<noscript><p>자바스크립트가 꺼져 있어 방명록을 불러올 수 없습니다.
<a href="https://github.com/{{ repo }}/issues">GitHub에서 보기</a></p></noscript>
</div>
<script src="{{ '/assets/js/guestbook.js' | relative_url }}"></script>
