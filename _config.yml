# ==========================================================
#  사이트 설정
#  고친 뒤에는 로컬 서버(jekyll serve)를 다시 켜야 반영됩니다.
# ==========================================================

title: wxxminjeong's devlog
description: Notes on things I learn, build, and break.
author: wxxminjeong
github_username: wxxminjeong
url: https://wxxminjeong.github.io
baseurl: ""
lang: en_US
timezone: Asia/Seoul

# 왼쪽 위 로고 글씨
brand:
  line1: dev
  line2: log
  tagline: by wxxminjeong

# 첫 화면에 보일 글 개수
front_page_posts: 10

# 글마다 달리는 댓글은 이 저장소의 GitHub Issues를 사용합니다
issues:
  repo: wxxminjeong/wxxminjeong.github.io
  comment_prefix: "[Comment]"

# ----------------------------------------------------------
#  빌드 설정 (보통은 건드리지 않아도 됩니다)
# ----------------------------------------------------------
theme: null   # GitHub Pages 기본 테마(primer)를 끄고 직접 만든 레이아웃만 사용
permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true   # 코드는 색 없이 <pre>로

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
