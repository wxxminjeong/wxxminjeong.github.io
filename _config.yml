# ==========================================================
#  사이트 설정
#  고친 뒤에는 로컬 서버(jekyll serve)를 다시 켜야 반영됩니다.
# ==========================================================

title: wxxminjeong의 개발 홈페이지
description: 공부한 것, 만든 것, 삽질한 것을 적어두는 곳입니다.
author: wxxminjeong
github_username: wxxminjeong
url: https://wxxminjeong.github.io
baseurl: ""
lang: ko_KR
timezone: Asia/Seoul

# 방명록은 이 저장소의 GitHub Issues를 사용합니다
guestbook:
  repo: wxxminjeong/wxxminjeong.github.io
  title_prefix: "[방명록]"

# 이 기간(일) 안에 쓴 글에는 NEW 표시가 붙습니다
new_days: 14

# ----------------------------------------------------------
#  빌드 설정 (보통은 건드리지 않아도 됩니다)
# ----------------------------------------------------------
theme: null   # GitHub Pages 기본 테마(primer)를 끄고 직접 만든 레이아웃만 사용
permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true   # 그 시절처럼 코드는 색 없이 <pre>로

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
